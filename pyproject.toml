[project]
name = "cv"
version = "0.0.0"
description = "Default template for PDM package"
authors = [
    {name = "RenChu Wang", email = "patrick1031wang@gmail.com"},
]
dependencies = ["omegaconf>=2.3.0", "jinja2>=3.1.6", "rich>=14.3.2", "markdown-it-py>=4.0.0"]
requires-python = "==3.13.*"
readme = "README.md"
license = {text = "MIT"}


[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "black>=26.1.0",
    "isort>=7.0.0",
    "autoflake>=2.3.1",
    "mypy>=1.19.1",
    "pip>=26.0",
    "ipython>=9.10.0",
]
[tool.autoflake]
in-place = true
recursive = true
exclude = "__init__.py"
expand-star-imports = true
remove-all-unused-imports = true
remove-duplicate-keys = true

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
show_error_codes = true
check_untyped_defs = true

[tool.pdm]
distribution = false
